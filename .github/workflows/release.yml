# this_file: .github/workflows/release.yml

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app
    
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
    
    - name: Show environment info
      run: |
        echo "macOS version: $(sw_vers -productVersion)"
        echo "Xcode version: $(xcodebuild -version)"
        echo "Swift version: $(swift --version)"
        echo "Release version: ${{ steps.version.outputs.VERSION }}"
        make version
    
    - name: Import Code Signing Certificate
      if: ${{ secrets.CODESIGN_CERTIFICATE != '' }}
      env:
        CODESIGN_CERTIFICATE: ${{ secrets.CODESIGN_CERTIFICATE }}
        CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
      run: |
        # Create temporary keychain
        security create-keychain -p actions temp.keychain
        security default-keychain -s temp.keychain
        security unlock-keychain -p actions temp.keychain
        
        # Import certificate
        echo "$CODESIGN_CERTIFICATE" | base64 --decode > certificate.p12
        security import certificate.p12 -k temp.keychain -P "$CODESIGN_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions temp.keychain
        
        # Clean up certificate file
        rm certificate.p12
    
    - name: Build and test
      run: ./scripts/build-and-test.sh --verbose
    
    - name: Build release artifacts
      env:
        CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        VERSION: ${{ steps.version.outputs.VERSION }}
      run: |
        ARGS="--release --verbose"
        if [[ -n "$CODESIGN_IDENTITY" ]]; then
          ARGS="$ARGS --sign"
        fi
        ./scripts/build-and-test.sh $ARGS
    
    - name: Notarize distribution
      if: ${{ secrets.APPLE_ID != '' && secrets.CODESIGN_IDENTITY != '' }}
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        TEAM_ID: ${{ secrets.TEAM_ID }}
        NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
      run: |
        # Notarize the PKG file
        echo "Notarizing PKG..."
        xcrun notarytool submit macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.pkg \
          --apple-id "$APPLE_ID" \
          --team-id "$TEAM_ID" \
          --password "$NOTARIZATION_PASSWORD" \
          --wait
        
        # Staple the ticket to the PKG
        echo "Stapling ticket to PKG..."
        xcrun stapler staple macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.pkg
        
        # Recreate DMG with stapled PKG
        echo "Recreating DMG with notarized PKG..."
        rm -f macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.dmg
        mkdir -p macdefaultbrowser/dist/dmg
        cp macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.pkg macdefaultbrowser/dist/dmg/
        hdiutil create -volname "macdefaultbrowser ${{ steps.version.outputs.VERSION }}" \
          -srcfolder macdefaultbrowser/dist/dmg \
          -ov -format UDZO \
          macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.dmg
        rm -rf macdefaultbrowser/dist/dmg
    
    - name: Cleanup keychain
      if: always() && ${{ secrets.CODESIGN_CERTIFICATE != '' }}
      run: |
        security delete-keychain temp.keychain || true
    
    - name: Prepare release artifacts
      run: |
        mkdir -p release
        
        # Copy main artifacts
        cp macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.dmg release/ || true
        cp macdefaultbrowser/dist/macdefaultbrowser-${{ steps.version.outputs.VERSION }}.pkg release/ || true
        
        # Create additional formats
        cp macdefaultbrowser/build/macdefaultbrowser release/
        cd release
        
        # Create tar.gz
        tar -czf macdefaultbrowser-${{ github.ref_name }}.tar.gz macdefaultbrowser
        
        # Create zip
        zip macdefaultbrowser-${{ github.ref_name }}.zip macdefaultbrowser
        
        # Remove binary from release directory
        rm macdefaultbrowser
    
    - name: Generate checksums
      run: |
        cd release
        
        # Generate SHA256 checksums for all files
        for file in *; do
          shasum -a 256 "$file" > "$file.sha256"
        done
        
        # Create a combined checksum file
        shasum -a 256 * | grep -v "\.sha256" > SHA256SUMS
    
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          release/*
        body: |
          ## Installation
          
          ### Homebrew
          ```bash
          brew install https://raw.githubusercontent.com/twardoch/macdefaultbrowser/main/macdefaultbrowser.rb --build-from-source
          ```
          
          ### Manual Installation
          1. Download the DMG file from the assets below
          2. Open the DMG and run the installer
          3. Or download the binary directly and place it in your PATH
          
          ### Verification
          All release artifacts include SHA256 checksums for verification.
          
          ## Changes
          See the full changelog in CHANGELOG.md
    
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          macdefaultbrowser/build/
          macdefaultbrowser/dist/
        retention-days: 7